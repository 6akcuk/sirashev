<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc"><title id="title">Internal queue emulator with four popup previews</title><desc id="desc">Parameter filters sit above four consistently spaced popup previews. Welcome branches to Campaign or Preferences depending on the clicked button. Campaign continues to a fourth popup, Confirmation. Arrows carry action and timing labels. Illustrative reconstruction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7c786f"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#252824}.label{font-size:14px;letter-spacing:1px;fill:#8f512f;font-weight:600}.h{font-size:23px;font-weight:600}.body{font-size:17px;fill:#62695f}.small{font-size:15px;fill:#62695f}.edge{fill:none;stroke:#7c786f;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1440" height="1100" rx="16" fill="#f4f2eb"/>
